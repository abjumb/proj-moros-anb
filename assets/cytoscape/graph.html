<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>mDiscovery Graph</title>
<style>
  /* Darcula tokens — keep in sync with src/mdiscovery/ui/theme.py TOKENS. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1E1F22; overflow: hidden; }
  #cy { width: 100vw; height: 100vh; }
  #tooltip {
    position: fixed;
    background: rgba(43,45,48,0.96);
    border: 1px solid #393B40;
    border-radius: 4px;
    padding: 8px 12px;
    color: #DFE1E5;
    font: 12px/1.5 'Inter', 'Segoe UI', system-ui, sans-serif;
    pointer-events: none;
    display: none;
    z-index: 9999;
    max-width: 260px;
  }
  #tooltip .type { font-size: 10px; color: #6F737A; text-transform: uppercase; letter-spacing: .05em; }
</style>
<script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="qwebchannel.js"></script>
</head>
<body>
<div id="cy"></div>
<div id="tooltip"></div>
<script>
// AS-31: Semantic type colour palette (Darcula-tuned — same hue per type as before)
const TYPE_COLORS = {
  Person:       { bg: '#253627', border: '#57965C' },
  Organization: { bg: '#2F2936', border: '#955AE0' },
  Location:     { bg: '#25324D', border: '#548AF7' },
  Event:        { bg: '#402929', border: '#DB5C5C' },
  Document:     { bg: '#3D3223', border: '#F2C55C' },
  Vehicle:      { bg: '#233838', border: '#43B1B1' },
  Phone:        { bg: '#273428', border: '#6AAB73' },
  Email:        { bg: '#362B39', border: '#C57FDB' },
  Account:      { bg: '#363023', border: '#D5B26C' },
  Unknown:      { bg: '#2B2D30', border: '#6F737A' },
};

function nodeColor(type) {
  return (TYPE_COLORS[type] || TYPE_COLORS.Unknown).bg;
}
function nodeBorder(type) {
  return (TYPE_COLORS[type] || TYPE_COLORS.Unknown).border;
}

// Base stylesheet kept as a const so conditional-formatting rules can be
// appended (and removed) at runtime via cy.style().
const STYLE = [
    {
      selector: 'node',
      style: {
        'background-color': ele => nodeColor(ele.data('type')),
        'border-color': ele => nodeBorder(ele.data('type')),
        'border-width': 2,
        'label': 'data(label)',
        'color': '#DFE1E5',
        'font-family': 'Inter, sans-serif',
        'font-size': 11,
        'text-valign': 'center',
        'text-halign': 'center',
        'text-wrap': 'ellipsis',
        'text-max-width': 80,
        'width': 60,
        'height': 60,
        'shape': 'ellipse',
      }
    },
    {
      selector: 'node[type="Organization"]',
      style: { shape: 'rectangle', width: 70, height: 40 }
    },
    {
      selector: 'node[type="Document"]',
      style: { shape: 'round-rectangle', width: 65, height: 42 }
    },
    {
      selector: 'node:selected',
      style: {
        'border-width': 3,
        'border-color': '#3574F0',
        'overlay-color': '#3574F0',
        'overlay-opacity': 0.15,
        'overlay-padding': 5,
        'z-index': 999,
      }
    },
    {
      selector: 'edge',
      style: {
        'width': ele => Math.max(1, (ele.data('strength') || 1) * 2),
        'line-color': '#393B40',
        'target-arrow-color': '#6F737A',
        'curve-style': 'bezier',
        'label': 'data(type)',
        'font-family': 'Inter, sans-serif',
        'font-size': 9,
        'color': '#6F737A',
        'text-rotation': 'autorotate',
      }
    },
    {
      selector: 'edge[direction="directed"]',
      style: { 'target-arrow-shape': 'triangle' }
    },
    {
      selector: 'edge[direction="undirected"]',
      style: { 'target-arrow-shape': 'none' }
    },
    {
      selector: 'edge[direction="bidirectional"]',
      style: {
        'target-arrow-shape': 'triangle',
        'source-arrow-shape': 'triangle',
        'source-arrow-color': '#6F737A',
      }
    },
    {
      selector: 'edge:selected',
      style: { 'line-color': '#3574F0', 'target-arrow-color': '#3574F0' }
    },
    {
      selector: '.highlighted',
      style: {
        'border-color': '#3574F0',
        'border-width': 3,
        'overlay-color': '#3574F0',
        'overlay-opacity': 0.15,
        'overlay-padding': 5,
      }
    },
    {
      selector: '.faded',
      style: { 'opacity': 0.2 }
    }
];

// Conditional formatting: node size scaled by degree (appended after the
// type-specific rules so it overrides their fixed width/height).
const DEGREE_SIZING_RULE = {
  selector: 'node',
  style: {
    'width':  ele => 36 + Math.min(ele.degree(false), 12) * 7,
    'height': ele => 36 + Math.min(ele.degree(false), 12) * 7,
  }
};

const cy = cytoscape({
  container: document.getElementById('cy'),
  style: STYLE,
  elements: [],
  layout: { name: 'cose', animate: false }
});

// Escape user-supplied strings before inserting into tooltip HTML.
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Tooltip
const tooltip = document.getElementById('tooltip');
cy.on('mouseover', 'node', evt => {
  const n = evt.target;
  const d = n.data();
  const pos = evt.renderedPosition;
  const extra = Object.entries(d)
    .filter(([k]) => !['id','label','type'].includes(k))
    .map(([k,v]) => `<b>${esc(k)}:</b> ${esc(v)}`)
    .join('<br>');
  tooltip.innerHTML = `<div class="type">${esc(d.type || 'Unknown')}</div>
    <b>${esc(d.label)}</b>${extra ? '<br>' + extra : ''}`;
  tooltip.style.display = 'block';
  tooltip.style.left = (pos.x + 15) + 'px';
  tooltip.style.top  = (pos.y - 10) + 'px';
});
cy.on('mouseout', 'node', () => { tooltip.style.display = 'none'; });

// Python bridge via QWebChannel
let pybridge = null;

function initChannel() {
  new QWebChannel(qt.webChannelTransport, channel => {
    pybridge = channel.objects.pybridge;
    // Signal Python that the view is ready
    if (pybridge && pybridge.viewReady) pybridge.viewReady();
  });
}
// Try to init channel; fall back gracefully if not in PyQt context
try { initChannel(); } catch(e) { console.log('Running outside PyQt context'); }

// Node click → notify Python
cy.on('tap', 'node', evt => {
  const id = evt.target.data('id');
  if (pybridge) pybridge.nodeSelected(id);
});

cy.on('tap', evt => {
  if (evt.target === cy && pybridge) pybridge.backgroundTapped();
});

// ── Public API called from Python ──────────────────────────────────────

window.loadGraph = function(jsonStr) {
  const data = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
  cy.elements().remove();
  cy.add(data.nodes || []);
  cy.add(data.edges || []);
  window.applyLayout('cose');
};

window.applyLayout = function(name) {
  // Animation is pleasant on workbench-sized graphs and pure cost on large
  // ones — skip it once the canvas holds thousands of elements.
  const animate = cy.elements().length < 1500;
  const layouts = {
    cose:        { name: 'cose',        animate, animationDuration: 400 },
    hierarchical:{ name: 'breadthfirst', animate, directed: true },
    circular:    { name: 'circle',       animate },
    grid:        { name: 'grid',         animate },
  };
  const opts = layouts[name] || layouts.cose;
  cy.layout(opts).run();
};

window.highlightPath = function(nodeIds) {
  cy.elements().addClass('faded').removeClass('highlighted');
  nodeIds.forEach(id => cy.$(`#${id}`).removeClass('faded').addClass('highlighted'));
};

window.clearHighlight = function() {
  cy.elements().removeClass('faded').removeClass('highlighted');
};

window.selectAndFit = function(ids) {
  const wanted = new Set(ids);
  cy.elements().unselect();
  const matches = cy.nodes().filter(n => wanted.has(n.id()));
  if (matches.length) {
    cy.fit(matches, 80);
    matches.select();
  }
  return matches.length;
};

window.addElements = function(data, anchorId) {
  // Incrementally add nodes/edges not already on the canvas. New nodes are
  // ringed around the anchor node so they appear where the user expanded.
  const d = (typeof data === 'string') ? JSON.parse(data) : data;
  const anchor = anchorId ? cy.$id(anchorId) : cy.collection();
  const base = anchor.nonempty() ? anchor.position() : { x: 0, y: 0 };

  const newNodes = (d.nodes || []).filter(n => cy.$id(n.data.id).empty());
  newNodes.forEach((n, i) => {
    const angle = (2 * Math.PI * i) / Math.max(newNodes.length, 1);
    n.position = {
      x: base.x + 130 * Math.cos(angle),
      y: base.y + 130 * Math.sin(angle),
    };
  });
  cy.add(newNodes);

  const newEdges = (d.edges || []).filter(e =>
    cy.$id(e.data.id).empty() &&
    cy.$id(e.data.source).nonempty() &&
    cy.$id(e.data.target).nonempty());
  cy.add(newEdges);

  return newNodes.length + newEdges.length;
};

window.expandNeighbors = function(nodeId) {
  const node = cy.$(`#${nodeId}`);
  node.neighborhood().removeClass('faded');
};

window.setDegreeSizing = function(enabled) {
  const style = enabled ? STYLE.concat([DEGREE_SIZING_RULE]) : STYLE;
  cy.style(style);
};
</script>
</body>
</html>
